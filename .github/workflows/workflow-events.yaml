name : Workflow Events

on:
    #on every push request 
    push:

    #on every pull request
    pull_request:

    #it will auto run the pipeline every 5 min after the first push 
    schedule:
        #* * * * * 
        #first * -> every min , second * -> hour , third * -> day of the month 
        #fourth * -> month , fifth * -> day of the week like( SUN , MON , OR 6 , 5 , etc);
        - cron: '21 6 * * *'
    #run workflow manually 
    workflow_dispatch:

jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
            - name: Show the trigger 
            #${{}} this is known as interpolation request
              run: echo "This workflow was triggered by a(n) ${{github.event_name}} event."; 