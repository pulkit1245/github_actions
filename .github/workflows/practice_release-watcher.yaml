name: The release watcher

on:
    # push:
    #     branches:
    #         - main 

    schedule:
        - cron: '0 9 * * MON'

    workflow_dispatch:

jobs:
    watch:
        runs-on: ubuntu-latest
        steps:
            - name: Print Event Name
              run: |
                echo "This run is triggered by ${{github.event_name}} event"
                date
                echo "Release watch complete"